# AWS Amplify Hosting – monorepo build spec (root).
# Use with "Monorepo app root" = frontend in Amplify Console.
# See docs/AMPLIFY-CLIENT-LINK.md for deployment steps.
version: 1
applications:
  - appRoot: frontend
    frontend:
      phases:
        preBuild:
          commands:
            - npm ci
        build:
          commands:
            - npm run build
      artifacts:
        baseDirectory: dist
        files:
          - '**/*'
      cache:
        paths:
          - node_modules/**/*
